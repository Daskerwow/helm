name: helm
description: >-
  Лёгкая, предсказуемая библиотека управления состоянием для Dart и Flutter:
  явные исходы диспатча, отменяемые асинхронные команды, синхронная
  публикация изменений без Stream-накладных расходов.
version: 0.1.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.0

# Ядро не зависит от Flutter. Виджет-слой (Riverpod, Provider, Bloc и т.д.)
# подключает Helm как обычный Dart-пакет и сам решает, как связать
# StateStore.states/effects со своими провайдерами — см. CHANGES.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  collection: ^1.19.1
  material_ui: ^1.1.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1

flutter:
  uses-material-design: true
