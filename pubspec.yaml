name: helm
description: Лёгкая библиотека управления состоянием для Dart и Flutter (без зависимости на Flutter SDK — совместима с любым слоем виджетов/DI, включая Riverpod).
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.0

# Ядро не зависит от Flutter. Виджет-слой (Riverpod, Provider, Bloc и т.д.)
# подключает Helm как обычный Dart-пакет и сам решает, как связать
# StateStore.states/effects со своими провайдерами — см. CHANGES.md.
dependencies:
  collection: ^1.19.1
  dio: ^5.11.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  go_router: ^17.5.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1

flutter:
  uses-material-design: true
