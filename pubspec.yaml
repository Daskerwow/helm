name: helm
description: >-
  Лёгкая, предсказуемая библиотека управления состоянием для Dart и Flutter:
  явные исходы диспатча, отменяемые асинхронные команды, синхронная
  публикация изменений без Stream-накладных расходов.
version: 0.2.0

workspace:
  - packages/helm_core
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.0

# Чистое Dart-ядро находится в локальном пакете helm_core. Этот пакет —
# Flutter-фасад и виджетный адаптер поверх него.
dependencies:
  flutter:
    sdk: flutter
  helm_core:
    ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.1

flutter:
  uses-material-design: true
